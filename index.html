<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Classroom Helper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* Custom Scrollbar (Light/Bright) */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03); 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3); /* blue-500 with opacity */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(59, 130, 246, 0.6); 
        }

        /* Bright Glassmorphism Cards */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
        }

        .picker-anim {
            animation: text-glow 0.15s infinite alternate;
        }

        @keyframes text-glow {
            0% { text-shadow: 0 0 10px rgba(59, 130, 246, 0.3); transform: scale(1); }
            100% { text-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 0 40px rgba(59, 130, 246, 0.2); transform: scale(1.05); }
        }

        .theme-gradient-text {
            background: linear-gradient(to right, #2563eb, #0d9488, #059669);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body class="h-screen w-full overflow-hidden flex flex-col p-6 text-slate-800 bg-gradient-to-br from-sky-100 via-blue-50 to-teal-100">

    <!-- Header -->
    <header class="glass-panel flex justify-between items-center mb-6 px-8 rounded-2xl py-4">
        <h1 class="text-3xl font-bold flex items-center gap-3">
            <span class="text-2xl">🌍</span> 
            <span class="theme-gradient-text tracking-wide">World Culture & English</span>
        </h1>
        <div class="flex gap-4 items-center">
            <!-- Edit Mode Toggle -->
            <button id="btn-edit-mode" onclick="toggleEditMode()" class="text-slate-500 hover:text-blue-600 text-lg py-2 px-4 rounded-xl transition-colors font-medium flex items-center gap-2" title="실수로 스티커를 잘못 주었을 때 숫자를 줄일 수 있는 모드입니다.">
                🛠️ 수정 모드
            </button>
            <div class="w-px h-6 bg-slate-300 mx-2"></div>
            <button onclick="downloadData()" class="bg-gradient-to-r from-indigo-400 to-purple-500 hover:from-indigo-500 hover:to-purple-600 text-white font-bold text-lg py-2 px-5 rounded-xl shadow-sm transition-all transform hover:scale-105">
                💾 자료 다운로드
            </button>
            <button onclick="resetPicker()" class="bg-white/80 hover:bg-white border border-white text-slate-700 text-lg py-2 px-6 rounded-xl transition-all font-medium shadow-sm">
                🔄 뽑기 초기화
            </button>
            <button onclick="openSettings()" class="bg-gradient-to-r from-blue-500 to-teal-400 hover:from-blue-600 hover:to-teal-500 text-white font-bold text-lg py-2 px-6 rounded-xl shadow-[0_4px_15px_rgba(59,130,246,0.3)] transition-all transform hover:scale-105">
                ⚙️ 명단 설정
            </button>
        </div>
    </header>

    <!-- Main Layout: Split Screen -->
    <main class="flex-1 flex gap-6 overflow-hidden">
        
        <!-- Left Panel: Picker -->
        <section class="w-1/3 glass-panel rounded-3xl p-8 flex flex-col items-center relative overflow-hidden">
            <h2 class="text-2xl font-extrabold text-blue-600 mb-8 mt-2 tracking-widest drop-shadow-sm">SELECT STUDENT</h2>
            
            <!-- Picker Mode Selection -->
            <div class="w-full mb-6 relative">
                <select id="picker-mode" onchange="changeMode()" class="w-full bg-white/80 border border-blue-200 text-blue-700 text-lg rounded-xl px-5 py-3 font-bold focus:outline-none focus:ring-2 focus:ring-blue-400 appearance-none shadow-sm cursor-pointer transition-all hover:bg-white">
                    <option value="lottery">🎱 로또 공 추첨 (섞기)</option>
                    <option value="race">🏁 장애물 낙하 경주 (도착)</option>
                    <option value="roulette">🎡 텍스트 룰렛</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-blue-500 text-sm">
                    ▼
                </div>
            </div>

            <div class="flex items-center justify-between mb-4 bg-white/60 px-5 py-3 rounded-xl border border-white shadow-sm w-full">
                <div class="text-base text-slate-600 font-medium flex items-center">
                    남은 대기자: <span id="available-count" class="text-xl font-bold text-teal-600 ml-2">0</span>명
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="exclude-checkbox" checked class="w-4 h-4 text-blue-600 bg-white border-blue-300 rounded focus:ring-blue-500 cursor-pointer">
                    <label for="exclude-checkbox" class="text-sm font-medium text-slate-600 cursor-pointer">뽑힌 학생 제외</label>
                </div>
            </div>
            
            <!-- Result Display (Lottery Machine) -->
            <div class="relative w-full flex-1 min-h-[280px] bg-white/40 rounded-3xl overflow-hidden shadow-inner border border-white/80 mb-8 mt-2 flex items-center justify-center">
                <canvas id="lottery-canvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
                <div id="picker-result-overlay" class="z-10 text-4xl font-bold text-slate-400 bg-white/95 border border-slate-100 px-8 py-4 rounded-2xl backdrop-blur-md transition-all duration-300 shadow-2xl drop-shadow-xl text-center min-w-[200px]">
                    대기중
                </div>
            </div>

            <!-- Action Buttons -->
            <button id="btn-pick" onclick="startPicking()" class="w-full bg-gradient-to-r from-blue-500 to-teal-400 hover:from-blue-600 hover:to-teal-500 text-white font-bold text-3xl py-6 rounded-2xl shadow-[0_8px_20px_rgba(59,130,246,0.3)] transition-all transform hover:scale-[1.02] active:scale-95 mb-4">
                시작하기
            </button>

            <!-- Winner Actions (Hidden by default) -->
            <div id="winner-actions" class="w-full hidden flex flex-col gap-3 mt-4 animate-fade-in">
                <p class="text-center text-sm text-slate-500 mb-1 font-medium">선택된 학생에게 리워드 지급</p>
                <button onclick="openStickerModal(currentWinner)" class="w-full bg-gradient-to-r from-blue-50 to-teal-50 hover:bg-white border border-blue-200 text-blue-600 font-bold text-lg py-4 rounded-xl transition-all shadow-sm">
                    🎁 리워드 선택하기
                </button>
            </div>
        </section>

        <!-- Right Panel: Sticker Board -->
        <section class="w-2/3 glass-panel rounded-3xl p-8 flex flex-col relative">
            <div class="flex justify-between items-center mb-6 mt-2">
                <h2 class="text-2xl font-extrabold text-blue-600 tracking-widest drop-shadow-sm">REWARD BOARD</h2>
                <div class="text-sm text-slate-500 font-medium flex gap-4 bg-white/50 px-4 py-2 rounded-full border border-white">
                    <span>💡 학생 이름을 클릭하여 스티커 지급</span>
                </div>
            </div>
            
            <!-- Sticker Grid -->
            <div id="sticker-grid" class="flex-1 overflow-y-auto grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 p-2 pb-10">
                <!-- Cards injected by JS -->
            </div>
        </section>
    </main>

    <!-- Sticker Modal -->
    <div id="sticker-modal" class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[55] hidden backdrop-blur-sm">
        <div class="glass-panel bg-white/95 rounded-3xl p-8 max-w-xl w-full max-h-[90vh] flex flex-col transform scale-95 transition-transform duration-200 shadow-2xl" id="sticker-modal-box">
            <div class="flex justify-between items-center mb-4 shrink-0">
                <h2 class="text-2xl font-bold text-slate-800">
                    <span id="sticker-student-name" class="text-blue-600">학생</span> 리워드 지급
                </h2>
                <button onclick="closeStickerModal()" class="text-slate-400 hover:text-slate-800 text-3xl font-light transition-colors">&times;</button>
            </div>
            
            <div class="overflow-y-auto pr-2 flex-1 pb-4 custom-scrollbar">
                <!-- Praise -->
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-blue-600 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2"><span>⭐</span> 칭찬 (행동 및 참여)</h3>
                    <div class="grid grid-cols-4 gap-3" id="praise-stickers-container">
                        <!-- Praise stickers injected here -->
                    </div>
                </div>

                <!-- Effort -->
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-teal-600 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2"><span>🌱</span> 노력 (성장 및 과정)</h3>
                    <div class="grid grid-cols-4 gap-3" id="effort-stickers-container">
                        <!-- Effort stickers injected here -->
                    </div>
                </div>

                <!-- Social -->
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-pink-500 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2"><span>💖</span> 사회성 (관계 및 소통)</h3>
                    <div class="grid grid-cols-4 gap-3" id="social-stickers-container">
                        <!-- Social stickers injected here -->
                    </div>
                </div>

                <!-- Emotional -->
                <div class="mb-2">
                    <h3 class="text-lg font-bold text-indigo-500 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2"><span>😌</span> 정서 (자아 및 마음)</h3>
                    <div class="grid grid-cols-4 gap-3" id="self-stickers-container">
                        <!-- Self stickers injected here -->
                    </div>
                </div>

                <!-- Teacher Observation Memo -->
                <div class="mt-6 mb-2">
                    <h3 class="text-lg font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 flex items-center gap-2"><span>📝</span> 교사 관찰 메모 (특기사항)</h3>
                    <textarea id="student-memo-input" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-700 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200 resize-none h-24" placeholder="학생의 구체적인 수업 태도, 발표 내용, 인상 깊었던 점 등을 적어주세요. 창을 닫으면 자동 저장되며 생기부 자료에 반영됩니다."></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50 hidden backdrop-blur-sm">
        <div class="glass-panel bg-white/95 w-2/3 max-w-2xl rounded-3xl p-8 flex flex-col max-h-[90vh] shadow-2xl">
            <h2 class="text-2xl font-bold text-blue-600 mb-2">학생 명렬표 설정</h2>
            <p class="text-slate-500 mb-6 font-medium">학생 이름을 쉼표(,)나 줄바꿈으로 구분해서 입력해주세요.</p>
            
            <textarea id="students-input" class="w-full flex-1 min-h-[300px] bg-slate-50 border border-slate-200 rounded-xl p-5 text-lg text-slate-800 focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 resize-none" placeholder="예시:&#10;김철수, 이영희, 홍길동&#10;또는&#10;김철수&#10;이영희&#10;홍길동"></textarea>
            
            <div class="flex justify-end gap-3 mt-6">
                <button onclick="closeSettings()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-lg py-3 px-8 rounded-xl transition-colors">
                    취소
                </button>
                <button onclick="saveSettings()" class="bg-gradient-to-r from-blue-500 to-teal-400 hover:from-blue-600 hover:to-teal-500 text-white font-bold text-lg py-3 px-8 rounded-xl transition-transform transform hover:scale-105 shadow-md">
                    저장하기
                </button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-[60] hidden backdrop-blur-sm">
        <div class="glass-panel bg-white/95 rounded-3xl p-8 max-w-sm w-full text-center transform scale-95 transition-transform duration-200 shadow-2xl" id="alert-box">
            <div class="text-4xl mb-4">💡</div>
            <p id="alert-message" class="text-lg text-slate-700 mb-8 font-medium break-keep"></p>
            <button onclick="closeAlert()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-lg py-3 rounded-xl transition-colors border border-slate-200">
                확인
            </button>
        </div>
    </div>

    <script>
        // State
        let allStudents = [];
        let availableStudents = [];
        let stickersData = {}; // Format: { "Name": { "p_star": 2, "e_grow": 1 } }
        let currentWinner = null;
        let isPicking = false;
        let isEditMode = false;
        let selectedStudentForSticker = null;
        let currentMode = 'lottery';

        // Matter.js variables
        let engine, render, runner;
        let balls = [];
        let pegs = [];
        let walls = [];
        let mixingInterval;
        let raceShelf = null;
        let raceGoal = null;
        let isRacing = false;

        // Reward Sticker Types (Expanded)
        const STICKER_TYPES = {
            praise: [
                { id: 'p_best', icon: '⭐', label: '최고' },
                { id: 'p_creative', icon: '💡', label: '창의' },
                { id: 'p_speak', icon: '🗣️', label: '발표' },
                { id: 'p_join', icon: '🙌', label: '참여' }
            ],
            effort: [
                { id: 'e_grow', icon: '🌱', label: '성장' },
                { id: 'e_focus', icon: '✍️', label: '집중' },
                { id: 'e_try', icon: '🏃', label: '도전' },
                { id: 'e_steady', icon: '💦', label: '성실' }
            ],
            social: [
                { id: 's_empathy', icon: '💖', label: '공감' },
                { id: 's_listen', icon: '👂', label: '경청' },
                { id: 's_team', icon: '🌈', label: '협동' },
                { id: 's_care', icon: '🤝', label: '배려' }
            ],
            self: [
                { id: 'm_courage', icon: '🦁', label: '용기' },
                { id: 'm_calm', icon: '😌', label: '조절' },
                { id: 'm_grit', icon: '🎯', label: '끈기' },
                { id: 'm_positive', icon: '✨', label: '긍정' }
            ]
        };
        const ALL_STICKERS = [
            ...STICKER_TYPES.praise, 
            ...STICKER_TYPES.effort, 
            ...STICKER_TYPES.social, 
            ...STICKER_TYPES.self
        ];

        // Elements
        const pickerDisplay = document.getElementById('picker-result-overlay');
        const availableCountDisplay = document.getElementById('available-count');
        const winnerActions = document.getElementById('winner-actions');
        const stickerGrid = document.getElementById('sticker-grid');
        const excludeCheckbox = document.getElementById('exclude-checkbox');
        const btnEditMode = document.getElementById('btn-edit-mode');
        const pickerModeSelect = document.getElementById('picker-mode');
        
        // Initialize
        function init() {
            loadData();
            initPhysics();
            if (allStudents.length === 0) {
                openSettings();
            } else {
                renderStickerBoard();
                updateAvailableCount();
            }
        }

        // Matter.js Physics Setup
        function initPhysics() {
            const canvas = document.getElementById('lottery-canvas');
            engine = Matter.Engine.create();
            
            render = Matter.Render.create({
                canvas: canvas,
                engine: engine,
                options: {
                    width: canvas.clientWidth || 300,
                    height: canvas.clientHeight || 300,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            runner = Matter.Runner.create();
            Matter.Runner.run(runner, engine);
            Matter.Render.run(render);

            Matter.Events.on(engine, 'collisionStart', handleCollision);
            
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    buildScene();
                }, 200);
            });

            // Ensure DOM is painted before first build
            setTimeout(buildScene, 100);
        }

        function changeMode() {
            if(isPicking) {
                pickerModeSelect.value = currentMode; // Revert if picking
                return;
            }
            currentMode = pickerModeSelect.value;
            buildScene();
        }

        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f43f5e'];

        function buildScene() {
            if(!engine) return;
            
            Matter.Composite.clear(engine.world);
            Matter.Engine.clear(engine);
            balls = [];
            pegs = [];
            walls = [];
            raceShelf = null;
            raceGoal = null;

            const canvas = document.getElementById('lottery-canvas');
            const w = canvas.clientWidth || 300;
            const h = canvas.clientHeight || 300;
            
            render.canvas.width = w;
            render.canvas.height = h;
            render.options.width = w;
            render.options.height = h;

            const invisibleWall = { isStatic: true, render: { visible: false } };

            if (currentMode === 'lottery') {
                engine.world.gravity.y = 0; // No gravity for zero-G mixing
                
                walls.push(
                    Matter.Bodies.rectangle(w/2, -25, w, 50, invisibleWall),
                    Matter.Bodies.rectangle(w/2, h+25, w, 50, invisibleWall),
                    Matter.Bodies.rectangle(-25, h/2, 50, h, invisibleWall),
                    Matter.Bodies.rectangle(w+25, h/2, 50, h, invisibleWall)
                );
                Matter.Composite.add(engine.world, walls);
                
                // Dynamic sizing to fit many balls
                const maxArea = (w * h) * 0.4; 
                const areaPerBall = maxArea / (availableStudents.length || 1);
                let radius = Math.sqrt(areaPerBall / Math.PI);
                radius = Math.max(10, Math.min(25, radius));

                availableStudents.forEach((student, index) => {
                    const ball = Matter.Bodies.circle(
                        Math.random() * (w - radius*2) + radius,
                        Math.random() * (h - radius*2) + radius,
                        radius,
                        {
                            restitution: 0.9,
                            friction: 0.005,
                            frictionAir: 0.01,
                            render: {
                                fillStyle: colors[index % colors.length],
                                strokeStyle: '#ffffff',
                                lineWidth: 2
                            },
                            studentName: student
                        }
                    );
                    balls.push(ball);
                });
                Matter.Composite.add(engine.world, balls);
            } 
            else if (currentMode === 'race') {
                engine.world.gravity.y = 0.8; // Falling gravity

                walls.push(
                    Matter.Bodies.rectangle(-25, h/2, 50, h, invisibleWall),
                    Matter.Bodies.rectangle(w+25, h/2, 50, h, invisibleWall)
                );

                // Goal Line at the bottom
                raceGoal = Matter.Bodies.rectangle(w/2, h + 10, w, 20, { 
                    isStatic: true, 
                    isSensor: true,
                    label: 'goal',
                    render: { fillStyle: '#10b981' } 
                });
                walls.push(raceGoal);

                // Starting Shelf at the top
                raceShelf = Matter.Bodies.rectangle(w/2, 40, w, 10, { 
                    isStatic: true, 
                    render: { fillStyle: '#cbd5e1' } 
                });
                walls.push(raceShelf);

                // Plinko Pegs
                const pegRows = Math.floor((h - 100) / 35);
                const pegCols = Math.floor(w / 40);
                for(let row=0; row<pegRows; row++) {
                    for(let col=0; col<pegCols; col++) {
                        const offsetX = (row % 2 === 0) ? 20 : 0;
                        const px = col * 40 + offsetX;
                        if (px > 15 && px < w - 15) {
                            pegs.push(Matter.Bodies.circle(px, 80 + row * 35, 4, {
                                isStatic: true,
                                render: { fillStyle: '#94a3b8' }
                            }));
                        }
                    }
                }
                Matter.Composite.add(engine.world, [...walls, ...pegs]);

                // Small balls on the shelf
                availableStudents.forEach((student, index) => {
                    const radius = Math.max(6, Math.min(12, 120 / Math.sqrt(availableStudents.length || 1))); 
                    const ball = Matter.Bodies.circle(
                        w/2 + (Math.random()-0.5)* (w - 40), 
                        20 - Math.random()*20,
                        radius,
                        {
                            restitution: 0.6,
                            friction: 0.05,
                            render: {
                                fillStyle: colors[index % colors.length],
                                strokeStyle: '#ffffff',
                                lineWidth: 1
                            },
                            studentName: student
                        }
                    );
                    balls.push(ball);
                });
                Matter.Composite.add(engine.world, balls);
            }
            else if (currentMode === 'roulette') {
                // No physical bodies needed, just clear the canvas visually
            }
        }

        // Data Management
        function loadData() {
            const savedStudents = localStorage.getItem('class_students');
            const savedStickers = localStorage.getItem('class_stickers');
            const savedAvailable = localStorage.getItem('class_available');

            if (savedStudents) {
                allStudents = JSON.parse(savedStudents);
                
                if (savedAvailable) {
                    availableStudents = JSON.parse(savedAvailable);
                } else {
                    availableStudents = [...allStudents];
                }
            }

            if (savedStickers) {
                let parsedStickers = JSON.parse(savedStickers);
                
                for (let student in parsedStickers) {
                    // 구버전(숫자) 데이터 마이그레이션
                    if (typeof parsedStickers[student] === 'number') {
                        parsedStickers[student] = { p_star: parsedStickers[student] };
                    } 
                    // 이전 버전(star, effort 속성) 데이터 마이그레이션
                    else if (parsedStickers[student].star !== undefined || parsedStickers[student].effort !== undefined) {
                        const oldStar = parsedStickers[student].star || 0;
                        const oldEffort = parsedStickers[student].effort || 0;
                        delete parsedStickers[student].star;
                        delete parsedStickers[student].effort;
                        if (oldStar > 0) parsedStickers[student].p_star = oldStar;
                        if (oldEffort > 0) parsedStickers[student].e_grow = oldEffort;
                    }
                }
                stickersData = parsedStickers;
            }
        }

        function saveData() {
            localStorage.setItem('class_students', JSON.stringify(allStudents));
            localStorage.setItem('class_available', JSON.stringify(availableStudents));
            localStorage.setItem('class_stickers', JSON.stringify(stickersData));
        }

        // Picking Logic
        function startPicking() {
            if (isPicking) return;
            
            if (availableStudents.length === 0) {
                showAlert("대기열에 남은 학생이 없습니다.\n초기화 버튼을 눌러주세요.");
                return;
            }

            isPicking = true;
            winnerActions.classList.add('hidden');
            pickerDisplay.classList.add('text-blue-600', 'scale-105');
            pickerDisplay.classList.remove('text-slate-400');
            pickerDisplay.innerText = "추첨 중...";
            
            if (currentMode === 'lottery') {
                pickerDisplay.innerText = "섞는 중...";
                // Apply random forces repeatedly to mix
                mixingInterval = setInterval(() => {
                    balls.forEach(ball => {
                        Matter.Body.applyForce(ball, ball.position, {
                            x: (Math.random() - 0.5) * 0.04,
                            y: (Math.random() - 0.5) * 0.04
                        });
                    });
                }, 50);

                setTimeout(() => {
                    clearInterval(mixingInterval);
                    const winnerIndex = Math.floor(Math.random() * availableStudents.length);
                    finishPicking(availableStudents[winnerIndex]);
                }, 2500);

            } else if (currentMode === 'race') {
                pickerDisplay.innerText = "경주 중...";
                isRacing = true;
                
                // Remove shelf to drop the balls
                if (raceShelf) {
                    Matter.Composite.remove(engine.world, raceShelf);
                    raceShelf = null;
                }

                // Timeout fallback just in case no ball hits the goal
                setTimeout(() => {
                    if(isRacing) {
                        const winnerIndex = Math.floor(Math.random() * availableStudents.length);
                        finishPicking(availableStudents[winnerIndex]);
                    }
                }, 10000);
            
            } else if (currentMode === 'roulette') {
                // Text shuffling
                let shuffles = 0;
                mixingInterval = setInterval(() => {
                    pickerDisplay.innerText = availableStudents[Math.floor(Math.random() * availableStudents.length)];
                    shuffles++;
                    if(shuffles > 40) {
                        clearInterval(mixingInterval);
                        const winnerIndex = Math.floor(Math.random() * availableStudents.length);
                        finishPicking(availableStudents[winnerIndex]);
                    }
                }, 50);
            }
        }

        function handleCollision(event) {
            if(!isRacing) return;
            const pairs = event.pairs;
            for (let i = 0; i < pairs.length; i++) {
                const bodyA = pairs[i].bodyA;
                const bodyB = pairs[i].bodyB;

                if (bodyA.label === 'goal' || bodyB.label === 'goal') {
                    const ball = bodyA.label === 'goal' ? bodyB : bodyA;
                    if (ball.studentName) {
                        finishPicking(ball.studentName);
                        break;
                    }
                }
            }
        }

        function finishPicking(winnerName) {
            if (mixingInterval) clearInterval(mixingInterval);
            isRacing = false;
            currentWinner = winnerName;
            
            pickerDisplay.classList.remove('scale-105');
            pickerDisplay.classList.add('scale-110', 'text-blue-600');
            pickerDisplay.innerText = currentWinner;

            if (excludeCheckbox.checked) {
                const idx = availableStudents.indexOf(currentWinner);
                if (idx > -1) {
                    availableStudents.splice(idx, 1);
                    updateAvailableCount();
                    saveData();
                }
            }

            winnerActions.classList.remove('hidden');
            isPicking = false;

            // Rebuild scene automatically after a delay to clear the winner/prepare next round
            setTimeout(() => {
                if(!isPicking) buildScene();
            }, 2500);
        }

        function resetPicker() {
            availableStudents = [...allStudents];
            updateAvailableCount();
            saveData();
            
            buildScene(); // Rebuild with full students
            
            pickerDisplay.innerText = "대기중";
            pickerDisplay.classList.remove('scale-110', 'text-blue-600');
            pickerDisplay.classList.add('text-slate-400');
            winnerActions.classList.add('hidden');
            currentWinner = null;
            showAlert("대기열이 전체 명단으로 초기화되었습니다.");
        }

        function updateAvailableCount() {
            availableCountDisplay.innerText = availableStudents.length;
        }

        // Toggle Edit Mode
        function toggleEditMode() {
            isEditMode = !isEditMode;
            if (isEditMode) {
                btnEditMode.classList.remove('text-slate-500');
                btnEditMode.classList.add('text-blue-600');
            } else {
                btnEditMode.classList.add('text-slate-500');
                btnEditMode.classList.remove('text-blue-600');
            }
            renderStickerBoard();
        }

        // Sticker Board Logic
        function renderStickerBoard() {
            stickerGrid.innerHTML = '';
            
            allStudents.forEach(student => {
                const data = stickersData[student] || {};
                
                const card = document.createElement('div');
                card.className = "bg-white/70 border border-white/80 rounded-2xl p-4 flex flex-col transition-all hover:bg-white shadow-sm hover:shadow-md";
                
                const header = document.createElement('div');
                header.className = "flex justify-between items-center mb-3 border-b border-slate-200 pb-2 cursor-pointer group";
                header.onclick = () => openStickerModal(student);
                
                const nameWrapper = document.createElement('div');
                nameWrapper.className = "flex items-center gap-2";

                const name = document.createElement('span');
                name.className = "text-xl font-bold text-slate-800 tracking-wide group-hover:text-blue-600 transition-colors";
                name.innerText = student;
                
                nameWrapper.appendChild(name);

                // Show memo icon if memo exists
                if (data.memo && data.memo.trim() !== '') {
                    const memoIcon = document.createElement('span');
                    memoIcon.className = "text-sm text-slate-400";
                    memoIcon.innerText = "📝";
                    memoIcon.title = data.memo;
                    nameWrapper.appendChild(memoIcon);
                }

                const addBtn = document.createElement('span');
                addBtn.className = "text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-md opacity-0 group-hover:opacity-100 transition-opacity font-bold";
                addBtn.innerText = "리워드 주기";

                header.appendChild(nameWrapper);
                header.appendChild(addBtn);
                card.appendChild(header);
                
                // Rewards Display Area
                const rewardsDiv = document.createElement('div');
                rewardsDiv.className = "flex flex-col gap-2 min-h-[60px]";

                let hasStickers = false;

                ALL_STICKERS.forEach(sticker => {
                    if (data[sticker.id] > 0 || (isEditMode && data[sticker.id] !== undefined)) {
                        hasStickers = true;
                        const row = document.createElement('div');
                        row.className = "flex justify-between items-start";
                        
                        const iconsWrapper = document.createElement('div');
                        iconsWrapper.className = "text-lg flex flex-wrap gap-1 items-center flex-1";
                        
                        const labelSpan = document.createElement('span');
                        labelSpan.className = "text-xs text-slate-500 mr-2 w-7 font-medium";
                        labelSpan.innerText = sticker.label;
                        iconsWrapper.appendChild(labelSpan);

                        for(let i=0; i<(data[sticker.id] || 0); i++) {
                            const s = document.createElement('span'); 
                            s.innerText = sticker.icon; 
                            iconsWrapper.appendChild(s);
                        }
                        
                        const controls = document.createElement('div');
                        controls.className = "flex gap-1 items-center ml-2";
                        
                        if (isEditMode) {
                            const btnMinus = document.createElement('button');
                            btnMinus.className = "w-6 h-6 rounded-md bg-red-100 text-red-500 text-xs flex items-center justify-center hover:bg-red-200 transition-colors font-bold";
                            btnMinus.innerText = "-";
                            btnMinus.onclick = (e) => { e.stopPropagation(); updateSticker(student, sticker.id, -1); };
                            controls.appendChild(btnMinus);
                        }
                        
                        row.appendChild(iconsWrapper);
                        row.appendChild(controls);
                        rewardsDiv.appendChild(row);
                    }
                });

                if (!hasStickers && !isEditMode) {
                    const emptyText = document.createElement('div');
                    emptyText.className = "text-slate-400 text-sm mt-2 italic flex-1 flex items-center justify-center cursor-pointer hover:text-blue-500 transition-colors font-medium";
                    emptyText.innerText = "이름을 클릭해 리워드 지급";
                    emptyText.onclick = () => openStickerModal(student);
                    rewardsDiv.appendChild(emptyText);
                }

                card.appendChild(rewardsDiv);
                stickerGrid.appendChild(card);
            });
        }

        function openStickerModal(student) {
            selectedStudentForSticker = student;
            document.getElementById('sticker-student-name').innerText = student;
            document.getElementById('student-memo-input').value = stickersData[student]?.memo || '';
            
            const praiseContainer = document.getElementById('praise-stickers-container');
            const effortContainer = document.getElementById('effort-stickers-container');
            const socialContainer = document.getElementById('social-stickers-container');
            const selfContainer = document.getElementById('self-stickers-container');
            
            praiseContainer.innerHTML = '';
            effortContainer.innerHTML = '';
            socialContainer.innerHTML = '';
            selfContainer.innerHTML = '';

            const createBtn = (sticker, bgClass, borderClass, textClass, hoverClass) => {
                const btn = document.createElement('button');
                btn.className = `flex flex-col items-center justify-center ${bgClass} hover:${hoverClass} border ${borderClass} rounded-xl p-3 transition-colors active:scale-95 shadow-sm`;
                btn.innerHTML = `<span class="text-3xl mb-1">${sticker.icon}</span><span class="text-sm font-bold ${textClass}">${sticker.label}</span>`;
                btn.onclick = () => {
                    updateSticker(selectedStudentForSticker, sticker.id, 1);
                    closeStickerModal();
                };
                return btn;
            };

            STICKER_TYPES.praise.forEach(sticker => {
                praiseContainer.appendChild(createBtn(sticker, 'bg-blue-50', 'border-blue-200', 'text-blue-700', 'bg-blue-100'));
            });

            STICKER_TYPES.effort.forEach(sticker => {
                effortContainer.appendChild(createBtn(sticker, 'bg-teal-50', 'border-teal-200', 'text-teal-700', 'bg-teal-100'));
            });

            STICKER_TYPES.social.forEach(sticker => {
                socialContainer.appendChild(createBtn(sticker, 'bg-pink-50', 'border-pink-200', 'text-pink-700', 'bg-pink-100'));
            });

            STICKER_TYPES.self.forEach(sticker => {
                selfContainer.appendChild(createBtn(sticker, 'bg-indigo-50', 'border-indigo-200', 'text-indigo-700', 'bg-indigo-100'));
            });

            const modal = document.getElementById('sticker-modal');
            const box = document.getElementById('sticker-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => box.classList.remove('scale-95'), 10);
        }

        function closeStickerModal() {
            // Save memo when closing
            if (selectedStudentForSticker) {
                const memoInput = document.getElementById('student-memo-input').value.trim();
                if (!stickersData[selectedStudentForSticker]) stickersData[selectedStudentForSticker] = {};
                stickersData[selectedStudentForSticker].memo = memoInput;
                saveData();
                renderStickerBoard();
            }

            const modal = document.getElementById('sticker-modal');
            const box = document.getElementById('sticker-modal-box');
            box.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                selectedStudentForSticker = null;
            }, 200);
        }

        function updateSticker(student, type, change) {
            if (!stickersData[student]) stickersData[student] = {};
            if (stickersData[student][type] === undefined) stickersData[student][type] = 0;
            
            stickersData[student][type] += change;
            if (stickersData[student][type] < 0) stickersData[student][type] = 0; // Prevent negative
            
            saveData();
            renderStickerBoard();
        }

        // Settings Modal Logic
        function openSettings() {
            document.getElementById('students-input').value = allStudents.join('\n');
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            const input = document.getElementById('students-input').value;
            const newStudents = input.split(/[\n,]+/).map(s => s.trim()).filter(s => s !== "");
            
            if (newStudents.length === 0) {
                showAlert("최소 1명 이상의 학생 이름을 입력해주세요.");
                return;
            }

            allStudents = newStudents;
            availableStudents = [...allStudents];
            
            // Ensure data structure exists for new students
            allStudents.forEach(student => {
                if(!stickersData[student]) {
                    stickersData[student] = {};
                }
            });
            
            saveData();
            updateAvailableCount();
            renderStickerBoard();
            buildScene(); // Update physics balls
            closeSettings();
            
            pickerDisplay.innerText = "대기중";
            pickerDisplay.classList.remove('scale-110', 'text-blue-600');
            pickerDisplay.classList.add('text-slate-400');
            winnerActions.classList.add('hidden');
            currentWinner = null;
            
            showAlert("명단이 성공적으로 저장되었습니다.");
        }

        // Custom Alert Logic
        const alertModal = document.getElementById('alert-modal');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');

        function showAlert(msg) {
            alertMessage.innerText = msg;
            alertModal.classList.remove('hidden');
            setTimeout(() => {
                alertBox.classList.remove('scale-95');
                alertBox.classList.add('scale-100');
            }, 10);
        }

        function closeAlert() {
            alertBox.classList.remove('scale-100');
            alertBox.classList.add('scale-95');
            setTimeout(() => {
                alertModal.classList.add('hidden');
            }, 200);
        }

        // Data Download Logic (For School Records)
        function downloadData() {
            if (allStudents.length === 0) {
                showAlert("다운로드할 학생 명단이 없습니다.");
                return;
            }

            // UTF-8 BOM for Excel to properly read Korean characters
            let csvContent = "\uFEFF"; 
            
            // Header Row
            let headers = ["이름"];
            ALL_STICKERS.forEach(sticker => headers.push(sticker.label));
            headers.push("총합", "교사 관찰 메모", "생기부 참고용 맞춤 문구");
            csvContent += headers.join(",") + "\n";

            // Data Rows
            allStudents.forEach(student => {
                let row = [student];
                let data = stickersData[student] || {};
                let total = 0;
                let traitCounts = [];
                let memo = data.memo || "";

                ALL_STICKERS.forEach(sticker => {
                    let count = data[sticker.id] || 0;
                    row.push(count);
                    total += count;
                    if (count > 0) {
                        traitCounts.push({ label: sticker.label, count: count });
                    }
                });

                row.push(total);
                row.push(`"${memo.replace(/"/g, '""')}"`); // Escape quotes in memo for CSV

                // Generate AI-like reference sentence
                let sentence = "";
                if (total === 0 && memo === "") {
                    sentence = "누적된 스티커 및 관찰 메모가 없습니다.";
                } else {
                    traitCounts.sort((a, b) => b.count - a.count); // Sort by highest count
                    
                    let baseSentence = "";
                    if (traitCounts.length === 0) {
                        baseSentence = "학습에 꾸준히 참여함.";
                    } else if (traitCounts.length === 1) {
                        const label1 = traitCounts[0].label;
                        const templates1 = [
                            `매 수업에 열정적으로 임하며, 특히 '${label1}' 역량이 우수함.`,
                            `학습 활동 중 '${label1}'(을)를 지속적으로 발휘하여 좋은 성취를 보임.`,
                            `수업 태도가 바르고 '${label1}' 측면에서 두각을 나타냄.`,
                            `스스로 탐구하려는 의지가 강하며 '${label1}'의 태도가 돋보임.`
                        ];
                        baseSentence = templates1[Math.floor(Math.random() * templates1.length)];
                    } else {
                        const label1 = traitCounts[0].label;
                        const label2 = traitCounts[1].label;
                        const templates2 = [
                            `평소 '${label1}' 역량이 뛰어나며, 모둠/개별 활동 시 '${label2}'하는 모습을 보여줌.`,
                            `수업 중 '${label1}' 및 '${label2}' 측면에서 눈에 띄는 발전과 긍정적인 학습 태도를 보임.`,
                            `과제를 수행할 때 '${label1}'(을)를 잃지 않고 '${label2}'(으)로 임하여 다른 학생들에게 귀감이 됨.`,
                            `특유의 '${label1}' 능력으로 수업에 활기를 불어넣으며, 동료들과 '${label2}'하는 자세가 훌륭함.`,
                            `항상 '${label1}'(을)를 실천하려 노력하며, 특히 '${label2}' 측면에서 두드러진 성장을 이룸.`
                        ];
                        baseSentence = templates2[Math.floor(Math.random() * templates2.length)];
                    }

                    // Append Memo naturally if exists
                    if (memo) {
                        const memoConnectors = [
                            ` 특히, 수업 중 "${memo}"(이)라는 점에서 깊은 인상을 남김.`,
                            ` 구체적인 관찰 사례로 "${memo}"하는 모습이 돋보였음.`,
                            ` 이와 관련하여 "${memo}" 등의 적극적인 참여를 보여줌.`,
                            ` 또한, "${memo}"(와)과 같은 실천을 통해 자신만의 학습 성장을 증명함.`
                        ];
                        sentence = baseSentence + memoConnectors[Math.floor(Math.random() * memoConnectors.length)];
                    } else {
                        sentence = baseSentence;
                    }
                }
                
                // Quote the sentence to prevent commas in the sentence from breaking CSV
                row.push(`"${sentence.replace(/"/g, '""')}"`);
                
                csvContent += row.join(",") + "\n";
            });

            // Trigger Download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            const today = new Date();
            const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2, '0')}${today.getDate().toString().padStart(2, '0')}`;
            
            link.setAttribute("href", url);
            link.setAttribute("download", `학생_활동기록_${dateStr}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Run on load
        window.onload = init;
    </script>
</body>
</html>
